name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag can be moved, and these
# workflows hold packages:write. Dependabot's github-actions ecosystem keeps
# the pins current and records the version in the trailing comment.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -q '^0$'
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./cmd/medulla
      # Tool pinned like the Actions above; the vulnerability database it
      # queries is always current regardless of the tool version.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: helm lint and render tests
        run: |
          helm lint deploy/helm/medulla
          ./deploy/helm/medulla/tests/render_test.sh

  # Fuzz the boundaries that take untrusted input: console paths reaching the
  # cluster, interpolated secrets spliced into config text, and session
  # cookies. Short runs — this is a smoke test for regressions, not a search.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: fuzz trust boundaries
        run: |
          set -euo pipefail
          fuzz() { # fuzz <package> <target>
            echo "::group::$2"
            go test "$1" -run '^$' -fuzz "^$2\$" -fuzztime=30s
            echo "::endgroup::"
          }
          fuzz ./internal/es      FuzzDoPath
          fuzz ./internal/es      FuzzValidIndexName
          fuzz ./internal/config  FuzzInterpolateNoInjection
          fuzz ./internal/config  FuzzInterpolateEnvNoInjection
          fuzz ./internal/config  FuzzLoadNeverPanics
          fuzz ./internal/auth    FuzzUnsign
          fuzz ./internal/auth    FuzzDecodeRejectsForged
      - name: upload failing corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: internal/*/testdata/fuzz/**
          if-no-files-found: ignore

  # The unit tests use a fake ES; this is the only job that proves flavor
  # detection, real _cat shapes and the RBAC-gated write paths work against
  # actual Elasticsearch and OpenSearch.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: start elasticsearch and opensearch
        run: docker compose up -d --wait es01 es02 opensearch
      - name: start medulla
        run: |
          go build -o /tmp/medulla ./cmd/medulla
          sed -e 's|http://es01:9200|http://localhost:9200|' \
              -e 's|http://opensearch:9200|http://localhost:9201|' \
              config.dev.yaml > /tmp/config.yaml
          /tmp/medulla -config /tmp/config.yaml &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "medulla did not start"; exit 1
      - name: e2e
        run: ./scripts/e2e.sh
      - name: cluster state on failure
        if: failure()
        run: |
          curl -s 'http://localhost:9200/_cat/indices?v' || true
          docker compose logs --tail=50 || true

  # The support matrix: every version the README claims, single node each,
  # through scripts/compat.sh — every page, the common writes, cache
  # invalidation, RBAC, and an unreachable cluster on the landing page.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: es7,          image: "docker.elastic.co/elasticsearch/elasticsearch:7.17.29", flavor: es7,        kind: es}
          - {name: es8,          image: "docker.elastic.co/elasticsearch/elasticsearch:8.19.7",  flavor: es8,        kind: es}
          - {name: es9,          image: "docker.elastic.co/elasticsearch/elasticsearch:9.2.1",   flavor: es9,        kind: es}
          - {name: opensearch2,  image: "opensearchproject/opensearch:2.19.3",                   flavor: opensearch, kind: os}
          - {name: opensearch3,  image: "opensearchproject/opensearch:3.3.2",                    flavor: opensearch, kind: os}
    name: compat (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: start ${{ matrix.image }}
        run: |
          if [ "${{ matrix.kind }}" = os ]; then
            env="-e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true -e OPENSEARCH_JAVA_OPTS=-Xms512m\ -Xmx512m"
          else
            env="-e xpack.security.enabled=false -e ES_JAVA_OPTS=-Xms512m\ -Xmx512m"
          fi
          eval docker run -d --name compat -p 9200:9200 -e discovery.type=single-node $env "${{ matrix.image }}"
          for i in $(seq 1 120); do
            curl -s localhost:9200/_cluster/health | grep -q '"status":"\(green\|yellow\)"' && exit 0
            sleep 1
          done
          docker logs --tail=50 compat; exit 1
      - name: start medulla
        run: |
          go build -o /tmp/medulla ./cmd/medulla
          /tmp/medulla -config scripts/compat.config.yaml &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && exit 0; sleep 1; done
          echo "medulla did not start"; exit 1
      - name: compat
        run: FLAVOR=${{ matrix.flavor }} ./scripts/compat.sh
      - name: cluster logs on failure
        if: failure()
        run: docker logs --tail=80 compat || true

  image:
    # Push the image only for version tags; PRs and branch pushes just test.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fuzz, e2e, compat]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing via GitHub's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # The README promises no `latest`; metadata-action adds one to
          # semver tags unless told not to.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance (how and from what it was built) and an SPDX SBOM,
          # attached to the image as attestations.
          provenance: mode=max
          sbom: true
      # Keyless: the signature binds the image digest to this workflow run's
      # GitHub identity and is logged in the public Rekor transparency log.
      - name: sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fuzz, e2e, compat]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: push and sign chart (OCI)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="ghcr.io/${{ github.repository_owner }}/charts"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package deploy/helm/medulla --version "$VERSION" --app-version "$VERSION"
          DIGEST=$(helm push "medulla-$VERSION.tgz" "oci://$REPO" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
          test -n "$DIGEST"
          cosign sign --yes "$REPO/medulla@$DIGEST"
