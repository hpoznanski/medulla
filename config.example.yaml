# Medulla configuration. Values support ${ENV_VAR} and ${file:/path} interpolation.
listen: ":8080"
# env: production   # requires session.secret to be set

clusters:
  - name: dev-es
    url: http://elasticsearch:9200
  - name: dev-opensearch
    url: http://opensearch:9200
  # - name: prod-eu
  #   url: https://es-prod-eu:9200
  #   auth:
  #     type: basic              # basic | api_key | none
  #     username: medulla
  #     password: ${ES_PROD_EU_PASSWORD}
  #   tls:
  #     ca_file: /etc/medulla/ca/prod-eu.pem

roles:
  admin:
    clusters: ["*"]
    permissions: [admin]
  operator:
    clusters: ["*"]
    permissions: [view, index:write, alias:write, template:write, snapshot:write, cluster:write, rest:full]
  developer:
    clusters: [dev-es, dev-opensearch]
    permissions: [view, rest:get]
  viewer:
    clusters: ["*"]
    permissions: [view]

# ldap:
#   url: ldaps://ldap.example.com
#   bind_dn: ${LDAP_BIND_DN}
#   bind_password: ${LDAP_BIND_PASSWORD}
#   user_base: ou=people,dc=example,dc=com
#   user_filter: "(uid=%s)"
#   group_to_role:
#     "cn=es-admins,ou=groups,dc=example,dc=com": admin
#     "cn=developers,ou=groups,dc=example,dc=com": developer

local_users:
  - name: admin
    password: changeme            # plaintext, or "bcrypt:$2a$..."
    roles: [admin]

session:
  # secret: ${SESSION_SECRET}     # >=32 bytes; comma-separated list rotates keys
  ttl: 12h
  # insecure_cookie: true         # only for plain-HTTP dev; cookies are Secure by default

# trusted_proxies:                # CIDRs of ingress/reverse proxies; enables real
#   - 10.0.0.0/8                  # client IPs (X-Forwarded-For) for rate limiting + audit

